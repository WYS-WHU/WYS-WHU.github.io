name: Build and deploy academic homepage

on:
  push:
    branches: [main]
    paths:
      - 'content/profile.json'
      - 'content/publications.json'
      - 'content/metrics.json'
      - 'site/**'
      - 'assets/**'
      - 'scripts/build_site.py'
      - 'scripts/refresh_metrics.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Refresh public ModelScope counters
        id: counters
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[refresh-counters]')
        continue-on-error: true
        run: python3 scripts/refresh_metrics.py
      - name: Report counter refresh fallback
        if: steps.counters.outcome == 'failure'
        run: echo "ModelScope counters could not be refreshed. The last validated snapshot is retained." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the validated counter snapshot
        if: steps.counters.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/metrics.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update public ModelScope counters"
          git push origin HEAD:main
      - name: Build the static site
        run: python3 scripts/build_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only public website output
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
